name: Frontend CI/CD Production Deployment

on:
  push:
    branches: [ main ] # Agar asosiy branchingiz master bo'lsa, master deb yozing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH orqali ulanish va faqat frontendni yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Serverdagi loyiha papkasiga o'tish
            cd /home/vaflo.uz
            
            # Agar sizda umumiy deploy.sh bo'lsa va u frontendni ham o'zi yangilasa:
            if [ -f deploy.sh ]; then
              chmod +x deploy.sh
              ./deploy.sh
            else
              # Agar deploy.sh bo'lmasa, faqat frontend papkasiga kirib yangilaymiz:
              cd frontend
              git fetch --all
              git reset --hard origin/main
              npm install
              npm run build
              
              # PM2 orqali faqat frontend servisini yoki umumiy ekotizimni yangilash:
              cd ..
              pm2 reload ecosystem.config.cjs --env production
            fi
            
            echo "Frontend muvaffaqiyatli yangilandi!"
